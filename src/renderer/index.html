<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Q2 Launcher</title>
    <!--
      No `http-equiv="Content-Security-Policy"` here on purpose: the policy is a
      response header, so it can differ between the dev server (injected by
      `onHeadersReceived`) and a production build (attached by the `q2launcher://`
      protocol handler) - both in src/main/index.ts. A meta fallback would paper
      over a header that fails to arrive, which is the failure story 035 fixed.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
