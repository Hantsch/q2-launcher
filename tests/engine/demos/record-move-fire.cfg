// Records move-fire.dm2 on demo1, the shareware pak's first level (the retail base1 is not in
// it): walk, turn and fire, then quit.
// `wait N` counts client frames, so the frame rate is pinned to make the waits wall-clock time:
// 60 frames are one second.
set cl_async 0
set cl_maxfps 60

// The client must be active in the level before `record` accepts.
wait 300
record move-fire
wait 120

+forward
wait 180
-forward

+attack
wait 120
-attack

+right
wait 90
-right

+forward
+attack
wait 150
-attack
-forward

+left
wait 120
-left

+attack
wait 90
-attack

+forward
wait 180
-forward

+right
+attack
wait 120
-attack
-right

wait 600

stop
quit
