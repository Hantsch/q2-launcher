appId: io.github.hantsch.q2launcher
productName: Q2 Launcher
copyright: Copyright (c) 2026 Hantsch

# Story 096 D3: this block is what makes electron-builder write the update-metadata files
# (latest.yml, app-update.yml) at build time - gated on `publish` being configured, not on the
# `--publish` CLI flag (app-builder-lib writes the update-info tasks regardless of `isPublish`).
# Every `package:*` script therefore passes `--publish never` explicitly, so nothing here uploads
# or creates a GitHub release on its own: without that flag electron-builder turns publishing on
# *implicitly* whenever it detects CI, and then dies with "GitHub Personal Access Token is not
# set" in any job that has no token (which is what broke release.yml's `build-linux` job).
# release.yml's `release` job publishes through `gh release create` in scripts/release.mjs, never
# through electron-builder.
publish:
  provider: github
  owner: Hantsch
  repo: q2-launcher

directories:
  buildResources: build
  output: release/${version}

files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!**/*.ts'

# BrowserWindow needs a real file at runtime; build resources are otherwise
# consumed only by electron-builder and are not copied beside app.asar.
extraResources:
  - from: build/icon.png
    to: icon.png
  - from: build/icon.ico
    to: icon.ico
  # Checked-in GPLv3 boilerplate for R1Q2 (story 080 D3), copied into a fresh install by
  # src/main/modules/downloads/bootstrap/r1q2-setup.ts via resolveR1q2LicensePath() in
  # 7za-path.ts's own resourcesPath convention.
  - from: resources/licenses/r1q2
    to: licenses/r1q2
    filter:
      - 'GPL-3.0.txt'

asar: true
electronLanguages:
  - en-US

win:
  # Vendored by scripts/fetch-7za.mjs (story 071 D3; Linux branch added by story 100 D9), which
  # the package:dir and package:win scripts run before electron-builder so a clean clone cannot
  # ship without the binary; resolved at runtime by src/main/modules/downloads/7za-path.ts via
  # process.resourcesPath. Platform-scoped (rather than a blanket top-level entry) because each
  # platform's build only ever has its own binary fetched into resources/bin - a shared filter
  # would try to package a file that was never downloaded for that target.
  extraResources:
    - from: resources/bin
      to: bin
      filter:
        - '7za.exe'
        - 'License.txt'
  icon: icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  # Deliberately NOT `${productName}` - that carries a space, and a space is what breaks the
  # update path. electron-builder writes the *sanitised* name (spaces -> `-`) into `latest.yml`'s
  # `url`, while `gh release create` uploads the file under its real name and GitHub turns spaces
  # into `.`; electron-updater then resolves a URL that no asset answers to. Naming the artifact
  # with the hyphen up front makes disk, `latest.yml` and the GitHub asset the same string.
  artifactName: Q2-Launcher-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Q2 Launcher

# Untested so far - the launcher targets Windows first, but nothing in the
# codebase is Windows-only by design.
linux:
  # See the win: extraResources comment above - same convention, `7zz` instead of `7za.exe`.
  extraResources:
    - from: resources/bin
      to: bin
      filter:
        - '7zz'
        - 'License.txt'
  target:
    - AppImage
  category: Game
  maintainer: Hantsch
  # Same reasoning as win.artifactName's comment above (no space, hyphen up front so disk,
  # latest.yml and the GitHub asset all agree). One difference: for AppImage builds
  # electron-builder resolves `${arch}` to `x86_64`, not `x64` - do not "fix" that to match the
  # Windows value, it would just be wrong for this target.
  artifactName: Q2-Launcher-${version}-linux-${arch}.${ext}

mac:
  target:
    - dmg
  category: public.app-category.games
