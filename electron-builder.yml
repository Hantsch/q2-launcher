appId: io.github.hantsch.q2launcher
productName: Q2 Launcher
copyright: Copyright (c) 2026 Hantsch

directories:
  buildResources: build
  output: release/${version}

files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!**/*.ts'

# BrowserWindow needs a real file at runtime; build resources are otherwise
# consumed only by electron-builder and are not copied beside app.asar.
extraResources:
  - from: build/icon.png
    to: icon.png
  - from: build/icon.ico
    to: icon.ico
  # Vendored by scripts/fetch-7za.mjs (story 071 D3), which the package:dir and
  # package:win scripts run before electron-builder so a clean clone cannot ship
  # without the binary; resolved at runtime by
  # src/main/modules/downloads/7za-path.ts via process.resourcesPath.
  - from: resources/bin
    to: bin
    filter:
      - '7za.exe'
      - 'License.txt'
  # Checked-in GPLv3 boilerplate for R1Q2 (story 080 D3), copied into a fresh install by
  # src/main/modules/downloads/bootstrap/r1q2-setup.ts via resolveR1q2LicensePath() in
  # 7za-path.ts's own resourcesPath convention.
  - from: resources/licenses/r1q2
    to: licenses/r1q2
    filter:
      - 'GPL-3.0.txt'

asar: true
electronLanguages:
  - en-US

win:
  icon: icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  artifactName: ${productName}-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Q2 Launcher

# Untested so far - the launcher targets Windows first, but nothing in the
# codebase is Windows-only by design.
linux:
  target:
    - AppImage
  category: Game
  maintainer: Hantsch

mac:
  target:
    - dmg
  category: public.app-category.games
