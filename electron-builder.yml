appId: io.github.hantsch.q2launcher
productName: Q2 Launcher
copyright: Copyright (c) 2026 Hantsch

directories:
  buildResources: build
  output: release/${version}

files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!**/*.ts'

# BrowserWindow needs a real file at runtime; build resources are otherwise
# consumed only by electron-builder and are not copied beside app.asar.
extraResources:
  - from: build/icon.png
    to: icon.png
  - from: build/icon.ico
    to: icon.ico

asar: true
electronLanguages:
  - en-US

win:
  icon: icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  artifactName: ${productName}-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Q2 Launcher

# Untested so far - the launcher targets Windows first, but nothing in the
# codebase is Windows-only by design.
linux:
  target:
    - AppImage
  category: Game
  maintainer: Hantsch

mac:
  target:
    - dmg
  category: public.app-category.games
