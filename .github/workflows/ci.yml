name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # electron@43 has no postinstall: the binary is downloaded lazily, the first time something
      # requires `electron`. Under `vitest run` that "something" is several test files at once
      # (they import `src/main/lib/logger`, which loads `electron-log/main`, which requires
      # `electron`), so concurrent install.js processes race for the same download and one of
      # them loses with "Electron failed to install correctly". Downloading once, serially, up
      # front removes the race - mirrors release.yml's "Install Electron binary" step.
      - name: Install Electron binary
        run: node node_modules/electron/install.js

      - name: Typecheck
        run: npm run typecheck

      # Story 100 D9: vendors the real 7-Zip Linux binary so extractor.test.ts's real-archive
      # block (gated on the binary's presence via resolveExtractorPath) actually runs here instead
      # of skipping. Ubuntu-only: the Windows leg's real-archive coverage is unchanged by this
      # story (it still runs only when resources/bin/7za.exe happens to be vendored locally).
      - name: Fetch 7-Zip binary
        if: matrix.os == 'ubuntu-latest'
        run: npm run fetch:7za

      - name: Test
        run: npm test

  linux-journey:
    # Story 100 D10 (AC9): the launcher's own end-to-end journey - add an existing installation
    # through the real folder-pick stub, edit and save a config profile, then press Play and watch
    # a REAL spawned process go running -> exited (`scripts/flows/linux-user-journey.mjs`). This is
    # the first job in this workflow that launches the actual Electron UI on Linux (the `test` job
    # above only runs `vitest`), so it is its own job rather than a step in the matrix above: it
    # needs a display (`xvfb-run`) and a real build, neither of which the unit-test leg needs.
    name: linux user journey (ubuntu-latest, xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Same race this workflow's own `test` job already guards against (see its "Install Electron
      # binary" step above) - Playwright's `_electron` driver resolves the local `electron`
      # devDependency, whose binary is otherwise downloaded lazily on first use.
      - name: Install Electron binary
        run: node node_modules/electron/install.js

      # `ubuntu-latest` does not ship `xvfb-run` - Electron needs a real display even for a
      # "headless" CI run on Linux.
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # See the identical step in `linux-verify.yml` for why this is here on a runner that already
      # has these: it is what lets `npm run ci:local` rehearse this job under act.
      - name: Install Electron's runtime libraries
        run: npx playwright install-deps chromium

      - name: Build
        run: npm run build

      # No `fetch:7za` here on purpose: off Windows this flow's fixture install root is a real,
      # tiny shell script (`writeLinuxJourneyInstallRoot()`, `scripts/lib/fixture.mjs`), never the
      # vendored 7-Zip binary - see that flow's own header comment for why. Sandboxing is disabled
      # the way most Electron-on-Linux CI setups are: the `chrome-sandbox` setuid helper needs
      # privileges a shared runner does not grant.
      - name: Linux user journey (AC9)
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
        run: xvfb-run --auto-servernum npm run ui:flow -- linux-user-journey

      # Story 103 D8: the runs-a-windows-build-via-a-runner story's own end-to-end proof
      # (`scripts/flows/windows-build-on-linux.mjs`) - a PE-only install raises the visible
      # executable-runnable check and a disabled `wine` Runner entry (AC2/AC6), Play refuses with
      # no `launch:state` running phase while wine is absent (AC7), and once a stub `wine` is put on
      # PATH and selected, Play reaches running -> exited for real (AC4/AC5). Same job as the Linux
      # user journey above (same build, same xvfb display) rather than a separate one - both flows
      # need nothing from each other, and standing up a second `npm run build` for one more flow
      # would only add CI time.
      - name: Windows build on Linux (AC2, AC4-AC7)
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
        run: xvfb-run --auto-servernum npm run ui:flow -- windows-build-on-linux
