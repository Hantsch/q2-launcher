name: linux-verify

# Proves the PACKAGED Linux AppImage - the thing Linux users actually run - with the same screenshot
# set and axe-core report Windows produces (`docs/UI-VERIFICATION.md`), plus that the About screen
# shows real release notes (`scripts/flows/about-release-notes.mjs`), through the harness's
# `--app=<path>` flag (scripts/verify.mjs / scripts/flow.mjs / scripts/lib/harness.mjs).
#
# Its own workflow, not folded into `release.yml`'s `build-linux` job: that job only builds and
# uploads the AppImage and must never be slowed down or risked by a UI smoke test. This workflow
# builds its own throwaway AppImage at whatever version package.json carries and uploads nothing
# but this run's screenshots/report.
#
# Linux is not a supported platform: manual dispatch only (or `npm run verify:linux` under act).
# The job is advisory the same way as every job in linux.yml - see that file's header.

on:
  workflow_dispatch:

concurrency:
  group: linux-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (ubuntu-latest, xvfb, packaged AppImage)
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        uses: actions/checkout@v4
        continue-on-error: ${{ github.actor != 'nektos/act' }}

      - id: setup
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        uses: ./.github/actions/setup-node-electron
        continue-on-error: ${{ github.actor != 'nektos/act' }}

      # `ubuntu-latest` ships neither a display nor (as of the 24.04 image) libfuse2, and an
      # AppImage's own runtime needs both: `xvfb-run` for a display, `libfuse2` to mount and exec
      # the AppImage itself (the harness hands the real packaged file to Playwright's
      # `_electron.launch({ executablePath })`, not an extracted one).
      - id: xvfb-libfuse2
        name: Install xvfb and libfuse2
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: ${{ github.actor != 'nektos/act' }}
        run: sudo apt-get update && sudo apt-get install -y xvfb libfuse2

      # Close to a no-op on `ubuntu-latest`; it makes the workflow self-contained under act, whose
      # `catthehacker/ubuntu:act-latest` image has none of Electron's shared libraries. Playwright's
      # installer knows the package names per Ubuntu release (24.04's t64 renames), but its list is
      # headless Chromium's and lacks GTK, which Electron links (`libgtk-3.so.0`).
      - id: electron-libs
        name: Install Electron's runtime libraries
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: ${{ github.actor != 'nektos/act' }}
        run: npx playwright install-deps chromium && sudo apt-get install -y libgtk-3-0t64

      # `package:linux` carries `--publish never` itself: electron-builder turns publishing on
      # implicitly when it detects CI, and a job without a token then dies after a good build.
      - id: package
        name: Package the Linux AppImage
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: ${{ github.actor != 'nektos/act' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package:linux

      # electron-builder writes `release/<version>/Q2-Launcher-<version>-linux-x86_64.AppImage`;
      # resolved by glob so this workflow does not change with every version bump.
      - id: app
        name: Resolve the built AppImage path
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: ${{ github.actor != 'nektos/act' }}
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find release -maxdepth 2 -name '*.AppImage' -print -quit)"
          if [ -z "$APP_PATH" ]; then echo "no .AppImage found under release/" >&2; exit 1; fi
          echo "Resolved AppImage: $APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - id: ui-verify
        name: UI verify (screenshots + axe-core) against the packaged AppImage
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: ${{ github.actor != 'nektos/act' }}
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
        run: xvfb-run --auto-servernum npm run ui:verify -- --app=${{ steps.app.outputs.path }}

      - id: about-release-notes
        name: About release notes flow against the packaged AppImage
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: ${{ github.actor != 'nektos/act' }}
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
        run: xvfb-run --auto-servernum npm run ui:flow about-release-notes -- --app=${{ steps.app.outputs.path }}

      # The output paths docs/UI-VERIFICATION.md documents for every ui:verify/ui:flow run; kept
      # even (especially) when an earlier step failed.
      - id: upload
        name: Upload screenshots and accessibility report
        if: always()
        continue-on-error: ${{ github.actor != 'nektos/act' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-ui-verify
          path: |
            .ui-verify/screenshots/**
            .ui-verify/a11y.json
            .ui-verify/a11y.md
          if-no-files-found: ignore
          retention-days: 14

      - id: advisory
        name: Report failed steps as warnings
        if: always()
        continue-on-error: true
        env:
          STEPS: ${{ toJSON(steps) }}
          CHECK: linux-verify.yml/verify
        run: node scripts/linux-advisory.mjs
