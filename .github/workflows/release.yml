name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release exactly this version, no leading "v" (passed as --version; required for the first release, e.g. 1.0.0)'
        required: false
        type: string
      bump:
        description: 'Force this bump level instead of deriving it from CHANGELOG.md (passed as --bump)'
        required: false
        type: choice
        options: ['', 'patch', 'minor', 'major']
        default: ''
      dry_run:
        description: 'Build and print, but do not write, commit, tag, push or publish (passed as --dry-run)'
        required: false
        type: boolean
        default: false
      skip_ci_guard:
        description: 'Skip the in-run ci checks (logged in the run)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Story 101 D3 split what used to be one `windows-latest` job into three, because an AppImage
# cannot be built on Windows and building the Windows half under Wine on Linux would replace the
# one configuration that is proven to produce a working `latest.yml`:
#
#   ci (windows)          runs the ci checks on the commit this run releases (skipped by skip_ci_guard).
#   plan (ubuntu)         decides the version ONCE, up front, and refuses early (an empty
#                         `## Unreleased`, an existing tag) so a refusal costs no build at all.
#   build-linux (ubuntu)  builds the AppImage AT THAT VERSION and uploads it as a workflow
#                         artifact.
#   release (windows)     unchanged from the old single job, plus: it downloads those artifacts,
#                         builds Windows, and hands scripts/release.mjs the SAME version the other
#                         two jobs used (`--version`, never a second derivation) - a version
#                         derived twice is a release whose tag and whose asset filenames disagree.
jobs:
  ci:
    name: ci checks
    runs-on: windows-latest
    if: ${{ !inputs.skip_ci_guard }}
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - id: sha
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-node-electron
        with:
          # Unit tests resolve `electron` to a stub (vitest.config.ts) and never need the binary.
          electron: 'false'

      - name: Audit
        run: npm audit --audit-level=high

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  plan:
    name: Plan
    runs-on: ubuntu-latest
    needs: ci
    # `!cancelled()` because a skipped `ci` (skip_ci_guard) would otherwise skip every job below it.
    if: ${{ !cancelled() && (needs.ci.result == 'success' || (needs.ci.result == 'skipped' && inputs.skip_ci_guard)) }}
    outputs:
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The plan refuses to recreate an existing tag, so it has to be able to see the tags.
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - uses: ./.github/actions/setup-node-electron
        with:
          electron: 'false'

      - name: Check the commit the ci checks saw
        id: head
        shell: bash
        env:
          CI_SHA: ${{ needs.ci.outputs.sha }}
          SKIP_CI: ${{ inputs.skip_ci_guard }}
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ -n "$CI_SHA" ] && [ "$CI_SHA" != "$HEAD_SHA" ]; then
            echo "::error::ci checked $CI_SHA but this run releases $HEAD_SHA" >&2
            exit 1
          fi
          if [ "$SKIP_CI" = "true" ]; then
            echo "::warning::ci checks skipped by $GITHUB_ACTOR for $HEAD_SHA"
          fi
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Resolve the version to release
        id: plan
        shell: bash
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
          RELEASE_BUMP_INPUT: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          ARGS=""
          if [ -n "$RELEASE_VERSION_INPUT" ]; then ARGS="$ARGS --version $RELEASE_VERSION_INPUT"; fi
          if [ -n "$RELEASE_BUMP_INPUT" ]; then ARGS="$ARGS --bump $RELEASE_BUMP_INPUT"; fi
          # --print-plan writes exactly one JSON object to stdout and nothing else: no bump, no
          # build, no tag. A ReleaseRefused exits non-zero here and the whole workflow stops
          # before any runner has started an electron-builder run.
          node scripts/release.mjs --print-plan $ARGS > release-plan.json
          VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('release-plan.json','utf8')).version")"
          if [ -z "$VERSION" ]; then echo "plan produced no version" >&2; exit 1; fi
          echo "Planned version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # Linux is not a supported platform: every step continues on error under GitHub (strict under act)
  # and a failed step is reported as a `::warning::`, so the job ends green and the `release` job
  # still runs. A step after the first skips once any step failed (`contains` does the skip: `if:`
  # without a status function implies `success()`, which a continue-on-error failure leaves true).
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    steps:
      - id: checkout
        uses: actions/checkout@v4
        continue-on-error: ${{ github.actor != 'nektos/act' }}
        with:
          ref: ${{ github.ref_name }}

      - id: guard
        name: Refuse a commit the ci checks did not see
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: ${{ github.actor != 'nektos/act' }}
        shell: bash
        env:
          GUARDED_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$HEAD_SHA" != "$GUARDED_SHA" ]; then
            echo "::error::checked out $HEAD_SHA but the ci checks approved $GUARDED_SHA" >&2
            exit 1
          fi

      - id: setup
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        uses: ./.github/actions/setup-node-electron
        continue-on-error: ${{ github.actor != 'nektos/act' }}
        with:
          electron: 'false'

      # electron-builder reads package.json's "version" to pick its output directory
      # (release/<version>) and to name every artifact, and this checkout is still on the
      # pre-bump version. Setting it to the planned version here is what makes the AppImage's
      # filename match the tag the `release` job will create - the bump itself is not committed
      # (this workspace is thrown away), it only has to be true for the duration of the build.
      - id: set-version
        name: Build at the planned version
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: ${{ github.actor != 'nektos/act' }}
        env:
          PLANNED_VERSION: ${{ needs.plan.outputs.version }}
        run: npm pkg set version="$PLANNED_VERSION"

      # Without this, the packaged AppImage bundles CHANGELOG.md still saying "## Unreleased" (this
      # checkout never gets the promoted changelog the `release` job commits later), so About is
      # permanently empty on Linux. It calls the same promote() code path scripts/release.mjs's real
      # run uses for the Windows leg, at the same version, and only writes this ephemeral checkout.
      - id: promote
        name: Promote CHANGELOG.md for the bundled release notes
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: ${{ github.actor != 'nektos/act' }}
        env:
          PLANNED_VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/release.mjs --promote-changelog --version "$PLANNED_VERSION"

      - id: package
        name: Package
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: ${{ github.actor != 'nektos/act' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package:linux

      - id: upload
        name: Upload the Linux artifacts
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: ${{ github.actor != 'nektos/act' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-assets
          # Exactly the two files artifacts.mjs expects for Linux, named individually rather than
          # globbed as `release/<version>/*`: the `release` job stages whatever arrives into the
          # same directory as the freshly built Windows assets, and a stray `latest.yml` in there
          # would overwrite the one every installed Windows client resolves its update through.
          # (scripts/release.mjs refuses such a collision too - this is the first of the two.)
          path: |
            release/${{ needs.plan.outputs.version }}/*.AppImage
            release/${{ needs.plan.outputs.version }}/latest-linux.yml
          if-no-files-found: warn
          retention-days: 1

      - id: advisory
        name: Report failed steps as warnings
        if: always()
        continue-on-error: true
        env:
          STEPS: ${{ toJSON(steps) }}
          CHECK: release.yml/build-linux
        run: node scripts/linux-advisory.mjs

  release:
    name: Release
    runs-on: windows-latest
    needs: [plan, build-linux]
    # A failed or skipped `build-linux` must not stop the release: Windows ships alone.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Refuse a commit the ci checks did not see
        shell: bash
        env:
          GUARDED_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$HEAD_SHA" != "$GUARDED_SHA" ]; then
            echo "::error::checked out $HEAD_SHA but the ci checks approved $GUARDED_SHA" >&2
            exit 1
          fi

      - uses: ./.github/actions/setup-node-electron
        with:
          # Unit tests resolve `electron` to a stub (vitest.config.ts) and never need the binary.
          electron: 'false'

      # Built outside release/<version>/ so release.mjs never collects it as a release asset.
      - name: Package the unpacked Windows app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package:dir:smoke

      - name: Resolve the unpacked app path
        id: smoke-app
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="release/smoke/win-unpacked/Q2 Launcher.exe"
          if [ ! -f "$APP_PATH" ]; then echo "no $APP_PATH after package:dir" >&2; exit 1; fi
          echo "Resolved unpacked app: $APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Packaged launch smoke
        shell: bash
        # Blocking by decision: a packaged app that does not launch is not released (story 280).
        run: npm run ui:flow -- about-release-notes --app="${{ steps.smoke-app.outputs.path }}"

      - name: Download the Linux artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: linux-release-assets
          path: linux-assets

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: 'true'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # scripts/release.mjs copies this directory's files into release/<version>/ between the
          # Windows build and the asset check; a missing or incomplete Linux set is a warning and
          # the Windows set ships alone.
          RELEASE_EXTRA_ASSETS_DIR: ${{ github.workspace }}/linux-assets
          # The version is NOT derived again here: it is the one the `plan` job resolved and the
          # `build-linux` job built at. Deriving it twice would tag one version and upload assets
          # named after another.
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          ARGS="--version $RELEASE_VERSION"
          if [ "$RELEASE_DRY_RUN_INPUT" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          node scripts/release.mjs $ARGS

      # After a release, main is one `release: x.y.z [skip ci]` commit (promoted CHANGELOG, version
      # bump) ahead of dev. A dev without it files its next entries under the already released
      # version when it is merged back, and the next release refuses. So dev follows the release
      # commit here - only as a pure fast-forward: if dev has moved on meanwhile, it is left alone
      # with a warning, never merged into by CI. A failed push is a warning too: the release itself
      # already went out.
      - name: Fast-forward dev to the release commit
        if: github.ref_name == 'main' && inputs.dry_run != true
        shell: bash
        run: |
          git fetch origin dev
          if git merge-base --is-ancestor origin/dev HEAD; then
            git push origin HEAD:dev || echo "::warning::could not fast-forward dev - run: git checkout dev && git merge origin/main"
          else
            echo "::warning::dev has commits that are not on main - run: git checkout dev && git merge origin/main"
          fi
