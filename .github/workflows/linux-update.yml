name: linux-update

# Proves that a packaged AppImage takes an update on its startup check and comes back as the new
# version: it builds the AppImage twice (current version and a patch bump), serves the newer one as
# a local generic update feed, and lets the older one find, download and install it on its own
# startup check. `scripts/linux-update-e2e.mjs` carries the whole mechanism and all the assertions;
# this workflow only supplies a Linux runner with a display and libfuse2.
#
# Linux is not a supported platform: manual dispatch only (or `npm run verify:linux` under act).
# The job is advisory the same way as every job in linux.yml - see that file's header.

on:
  workflow_dispatch:

concurrency:
  group: linux-update-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: AppImage self-update (ubuntu-latest, xvfb)
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        uses: actions/checkout@v4
        continue-on-error: ${{ github.actor != 'nektos/act' }}

      - id: setup
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        uses: ./.github/actions/setup-node-electron
        continue-on-error: ${{ github.actor != 'nektos/act' }}

      # Mirrors `linux-verify.yml`: an AppImage's runtime needs a display (`xvfb-run`) and libfuse2
      # to mount and exec itself. This job needs them twice over: the older AppImage is launched
      # through the harness's `--app=<path>` route, and the newer one is exec'd again by
      # `electron-updater`'s own AppImage install path.
      - id: xvfb-libfuse2
        name: Install xvfb and libfuse2
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: ${{ github.actor != 'nektos/act' }}
        run: sudo apt-get update && sudo apt-get install -y xvfb libfuse2

      # See the identical step in `linux-verify.yml` for why this is here on a runner that already
      # has these: it is what lets `npm run verify:linux` rehearse this workflow under act.
      - id: electron-libs
        name: Install Electron's runtime libraries
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: ${{ github.actor != 'nektos/act' }}
        run: npx playwright install-deps chromium && sudo apt-get install -y libgtk-3-0t64

      # The script builds both AppImages itself: each needs its own version baked in, and both need
      # the local feed's port in their `app-update.yml`.
      - id: update-e2e
        name: Build both AppImages and take the update
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: ${{ github.actor != 'nektos/act' }}
        timeout-minutes: 45
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_DISABLE_SANDBOX: '1'
        run: xvfb-run --auto-servernum node scripts/linux-update-e2e.mjs

      # The relaunched launcher's own log is the evidence this run turns on, so it is kept even
      # (especially) when an earlier step failed.
      - id: upload
        name: Upload the launcher logs
        if: always()
        continue-on-error: ${{ github.actor != 'nektos/act' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-update-logs
          path: |
            .ui-verify/linux-update/xdg-config/**/logs/*.log
            .ui-verify/fixture/empty/userdata/logs/*.log
          if-no-files-found: ignore
          retention-days: 14

      - id: advisory
        name: Report failed steps as warnings
        if: always()
        continue-on-error: true
        env:
          STEPS: ${{ toJSON(steps) }}
          CHECK: linux-update.yml/update
        run: node scripts/linux-advisory.mjs
