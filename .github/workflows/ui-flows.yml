name: ui-flows

# The Windows smoke set: ui:verify plus the core-journey flows. PRs into main and manual dispatch
# only: main changes solely through PRs, so a push or schedule run would re-verify the same tree.
# The sharded Linux flows live in linux.yml (manual dispatch only).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ui-flows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-verify:
    name: UI verify (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-electron

      - name: Fetch 7-Zip
        shell: bash
        run: npm run fetch:7za

      - name: Build
        shell: bash
        run: npm run build:dev

      - name: UI verify (screenshots + axe-core)
        shell: bash
        run: npm run ui:verify

      - name: 'Core journey on Windows: add installation, edit config, Play, exited'
        shell: bash
        run: npm run ui:flow -- linux-user-journey

      - name: Bootstrap wizard flow
        shell: bash
        run: npm run ui:flow -- bootstrap-wizard

      - name: Servers join flow
        shell: bash
        run: npm run ui:flow -- servers-join

      - name: Replays play Q2PRO flow
        shell: bash
        run: npm run ui:flow -- replays-play-q2pro

      - name: Mods install flow
        shell: bash
        run: npm run ui:flow -- mods-install

      - name: Steam handoff flow
        shell: bash
        run: npm run ui:flow -- steam-handoff

      - name: About release notes flow
        shell: bash
        run: npm run ui:flow -- about-release-notes

      - name: Open keycap dialog flow
        shell: bash
        run: npm run ui:flow -- open-keycap-dialog

      - name: Upload screenshots and accessibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ui-verify
          path: |
            .ui-verify/screenshots/**
            .ui-verify/a11y.json
            .ui-verify/a11y.md
          if-no-files-found: error
          retention-days: 14
